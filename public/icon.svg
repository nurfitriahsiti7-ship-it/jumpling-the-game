<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Speed motion arcs -->
  <path d="M 90 280 C 130 140 280 80 430 110" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 60 340 C 120 200 240 160 410 180" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Golden Coin Central Badge -->
  <g filter="url(#glow)">
    <circle cx="256" cy="236" r="130" fill="url(#gold)" stroke="#78350f" stroke-width="10"/>
    <circle cx="256" cy="236" r="105" fill="#fef08a" opacity="0.3" stroke="#ca8a04" stroke-width="4"/>

    <!-- Central 5-Point Star -->
    <polygon points="256,150 280,215 350,215 293,256 314,320 256,280 198,320 219,256 162,215 232,215" fill="#ca8a04" />
  </g>

  <!-- Crown on Top of Coin -->
  <path d="M 200 130 L 220 70 L 256 100 L 292 70 L 312 130 Z" fill="url(#crown)" stroke="#854d0e" stroke-width="5" />
  <circle cx="220" cy="65" r="7" fill="#ffffff" />
  <circle cx="256" cy="95" r="7" fill="#ffffff" />
  <circle cx="292" cy="65" r="7" fill="#ffffff" />

  <!-- "JUMPING" Typography Banner -->
  <g>
    <rect x="66" y="380" width="380" height="74" rx="20" fill="#dc2626" stroke="#ffffff" stroke-width="5" />
    <text x="256" y="432" font-family="'Titan One', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">JUMPING</text>
  </g>
</svg>
